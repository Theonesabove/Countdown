<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>World Cup 2026 Live Tracker</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #0f3d7a 0%, #071a3d 45%, #04101f 100%);
      color: white;
      padding: 30px 16px 60px;
      text-align: center;
    }

    h1 {
      font-size: clamp(32px, 6vw, 70px);
      margin: 0;
      font-weight: 900;
    }

    #days {
      margin-top: 20px;
      font-size: clamp(70px, 18vw, 180px);
      font-weight: 900;
      color: #ffd700;
    }

    #label {
      font-size: clamp(18px, 3vw, 32px);
      color: #dbeafe;
    }

    .card {
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 24px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
    }

    #lastUpdated {
      margin-bottom: 20px;
      color: #bcd7ff;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 14px;
      overflow: hidden;
    }

    thead {
      background: rgba(255,255,255,0.08);
    }

    th {
      padding: 14px;
      color: #ffd700;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1px;
    }

    td {
      padding: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 15px;
    }

    .score {
      font-weight: bold;
      color: #a7f3d0;
      font-size: 18px;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 12px;
    }

    .live {
      background: #dc2626;
      color: white;
      animation: pulse 1.2s infinite;
    }

    .finished {
      background: #16a34a;
      color: white;
    }

    .upcoming {
      background: #2563eb;
      color: white;
    }

    .unknown {
      background: #6b7280;
      color: white;
    }

    .error {
      color: #ffb4b4;
      padding: 24px;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220,38,38,.8); }
      70% { box-shadow: 0 0 0 10px rgba(220,38,38,0); }
      100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
    }

    @media (max-width: 850px) {
      table, thead, tbody, tr, td, th {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        margin-bottom: 14px;
        border-radius: 14px;
        background: rgba(255,255,255,0.05);
        overflow: hidden;
      }

      td {
        text-align: left;
        border: none;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }

      td::before {
        content: attr(data-label) ": ";
        color: #ffd700;
        font-weight: bold;
      }
    }
  </style>
</head>

<body>

  <h1>🏆 WORLD CUP 2026 LIVE 🏆</h1>

  <div id="days">--</div>
  <div id="label">days left until kickoff</div>

  <div class="card">
    <h2>Fixtures & Live Results</h2>
    <div id="lastUpdated">Loading live data...</div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Match</th>
          <th>Stage</th>
          <th>Score</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="matches">
        <tr>
          <td colspan="6">Loading matches...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://worldcup26.ir/get/games";

    function updateCountdown() {
      const now = new Date();
      const start = new Date("2026-06-11T00:00:00");
      const diff = Math.ceil((start - now) / (1000 * 60 * 60 * 24));

      document.getElementById("days").textContent = diff > 0 ? diff : 0;
      document.getElementById("label").textContent =
        diff > 0 ? "days left until kickoff" : "The World Cup has started";
    }

    function normalizeGames(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data.games)) return data.games;
      if (Array.isArray(data.data)) return data.data;
      if (Array.isArray(data.matches)) return data.matches;
      return [];
    }

    function getValue(obj, keys, fallback = "TBD") {
      for (const key of keys) {
        if (obj[key] !== undefined && obj[key] !== null && obj[key] !== "") {
          return obj[key];
        }
      }
      return fallback;
    }

    function getTeamName(team) {
      if (!team) return "TBD";
      if (typeof team === "string") return team;
      return team.name || team.country || team.title || team.shortName || "TBD";
    }

    function getHomeTeam(game) {
      return getTeamName(game.homeTeam || game.home_team || game.team1 || game.home || game.team_a);
    }

    function getAwayTeam(game) {
      return getTeamName(game.awayTeam || game.away_team || game.team2 || game.away || game.team_b);
    }

    function getDate(game) {
      const raw = getValue(game, ["date", "matchDate", "utcDate", "datetime", "kickoff", "startTime"], "");

      if (!raw) return "TBD";

      const parsed = new Date(raw);
      if (isNaN(parsed)) return raw;

      return parsed.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function getTime(game) {
      const raw = getValue(game, ["time", "matchTime", "utcDate", "datetime", "kickoff", "startTime"], "");

      if (!raw) return "TBD";

      if (typeof raw === "string" && raw.includes(":") && !raw.includes("T")) {
        return raw;
      }

      const parsed = new Date(raw);
      if (isNaN(parsed)) return "TBD";

      return parsed.toLocaleTimeString(undefined, {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getScore(game) {
      const homeScore = getValue(game, [
        "homeScore",
        "home_score",
        "homeGoals",
        "team1Score",
        "score1"
      ], null);

      const awayScore = getValue(game, [
        "awayScore",
        "away_score",
        "awayGoals",
        "team2Score",
        "score2"
      ], null);

      if (homeScore !== null && awayScore !== null) {
        return `${homeScore} - ${awayScore}`;
      }

      if (game.score) {
        if (typeof game.score === "string") return game.score;

        if (game.score.fullTime) {
          return `${game.score.fullTime.home ?? 0} - ${game.score.fullTime.away ?? 0}`;
        }

        if (game.score.ft) {
          return `${game.score.ft[0]} - ${game.score.ft[1]}`;
        }
      }

      return "TBD";
    }

    function getStage(game) {
      return getValue(game, ["stage", "round", "group", "phase"], "TBD");
    }

    function getStatus(game) {
      const raw = String(
        getValue(game, ["status", "matchStatus", "state"], "upcoming")
      ).toLowerCase();

      if (
        raw.includes("live") ||
        raw.includes("playing") ||
        raw.includes("progress") ||
        raw.includes("first") ||
        raw.includes("second")
      ) {
        return { text: "LIVE", className: "live" };
      }

      if (
        raw.includes("finished") ||
        raw.includes("completed") ||
        raw.includes("ended") ||
        raw.includes("full")
      ) {
        return { text: "Finished", className: "finished" };
      }

      if (
        raw.includes("scheduled") ||
        raw.includes("upcoming") ||
        raw.includes("not")
      ) {
        return { text: "Upcoming", className: "upcoming" };
      }

      return { text: raw.toUpperCase(), className: "unknown" };
    }

    function renderGames(games) {
      const tbody = document.getElementById("matches");
      tbody.innerHTML = "";

      if (!games.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="error">
              No matches returned from the API.
            </td>
          </tr>
        `;
        return;
      }

      games.forEach(game => {
        const status = getStatus(game);

        const row = document.createElement("tr");

        row.innerHTML = `
          <td data-label="Date">${getDate(game)}</td>
          <td data-label="Time">${getTime(game)}</td>
          <td data-label="Match">${getHomeTeam(game)} vs ${getAwayTeam(game)}</td>
          <td data-label="Stage">${getStage(game)}</td>
          <td data-label="Score" class="score">${getScore(game)}</td>
          <td data-label="Status">
            <span class="badge ${status.className}">
              ${status.text}
            </span>
          </td>
        `;

        tbody.appendChild(row);
      });
    }

    async function loadGames() {
      const tbody = document.getElementById("matches");
      const lastUpdated = document.getElementById("lastUpdated");

      try {
        const response = await fetch(API_URL + "?t=" + Date.now());

        if (!response.ok) {
          throw new Error("API failed");
        }

        const data = await response.json();
        const games = normalizeGames(data);

        renderGames(games);

        lastUpdated.textContent =
          "Last updated: " + new Date().toLocaleTimeString();

      } catch (error) {
        console.error(error);

        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="error">
              Could not load live World Cup data. The API may be down or blocking browser requests.
            </td>
          </tr>
        `;

        lastUpdated.textContent = "Live data failed to load.";
      }
    }

    updateCountdown();
    loadGames();

    setInterval(updateCountdown, 1000 * 60 * 60);
    setInterval(loadGames, 30000);
  </script>

</body>
</html>
