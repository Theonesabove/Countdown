<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>World Cup 2026 Live Tracker</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #0f3d7a 0%, #071a3d 45%, #04101f 100%);
      color: white;
    }

    body {
      padding: 30px 16px 60px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 70px);
      font-weight: 900;
      text-shadow: 0 0 10px rgba(255,255,255,.5), 0 0 25px rgba(0,194,255,.6);
    }

    #days {
      margin-top: 20px;
      font-size: clamp(70px, 18vw, 180px);
      font-weight: 900;
      line-height: 1;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,.8), 0 0 40px rgba(255,215,0,.5);
    }

    #label {
      margin-top: 10px;
      font-size: clamp(18px, 3vw, 32px);
      color: #dbeafe;
    }

    .card {
      width: 100%;
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 24px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: clamp(24px, 4vw, 40px);
    }

    #lastUpdated {
      margin-bottom: 20px;
      color: #bcd7ff;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 14px;
      overflow: hidden;
    }

    thead {
      background: rgba(255,255,255,0.08);
    }

    th {
      padding: 14px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffd700;
    }

    td {
      padding: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 15px;
    }

    tr:hover {
      background: rgba(255,255,255,0.04);
    }

    .result {
      font-weight: bold;
      color: #a7f3d0;
      font-size: 17px;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 12px;
    }

    .live {
      background: #dc2626;
      color: white;
      animation: pulse 1.2s infinite;
    }

    .finished {
      background: #16a34a;
      color: white;
    }

    .upcoming {
      background: #2563eb;
      color: white;
    }

    .unknown {
      background: #6b7280;
      color: white;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220,38,38,.8); }
      70% { box-shadow: 0 0 0 10px rgba(220,38,38,0); }
      100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
    }

    .loading, .error {
      padding: 30px;
      font-size: 18px;
    }

    .error {
      color: #ffb4b4;
    }

    @media (max-width: 850px) {
      table, thead, tbody, tr, td, th {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        margin-bottom: 14px;
        border-radius: 14px;
        overflow: hidden;
        background: rgba(255,255,255,0.05);
      }

      td {
        text-align: left;
        border: none;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }

      td::before {
        content: attr(data-label) ": ";
        font-weight: bold;
        color: #ffd700;
      }
    }
  </style>
</head>

<body>

  <h1>🏆 WORLD CUP 2026 LIVE 🏆</h1>

  <div id="days">--</div>
  <div id="label">days left until kickoff</div>

  <div class="card">
    <h2>Fixtures & Live Results</h2>
    <div id="lastUpdated">Loading live data...</div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Match</th>
          <th>Stage</th>
          <th>Result</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="matches">
        <tr>
          <td colspan="6" class="loading">Loading matches...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://worldcup2026-api.vercel.app/api/matches";

    function updateCountdown() {
      const now = new Date();
      const worldCupStart = new Date("2026-06-11T00:00:00");
      const diff = Math.ceil((worldCupStart - now) / (1000 * 60 * 60 * 24));

      document.getElementById("days").textContent = diff > 0 ? diff : 0;
      document.getElementById("label").textContent =
        diff > 0 ? "days left until kickoff" : "The World Cup has started";
    }

    function pick(obj, keys, fallback = "TBD") {
      for (const key of keys) {
        if (obj && obj[key] !== undefined && obj[key] !== null && obj[key] !== "") {
          return obj[key];
        }
      }
      return fallback;
    }

    function getTeamName(team) {
      if (!team) return "TBD";
      if (typeof team === "string") return team;
      return team.name || team.country || team.shortName || "TBD";
    }

    function getMatchDate(match) {
      const rawDate = pick(match, ["date", "matchDate", "utcDate", "kickoff", "startTime"], "");
      if (!rawDate) return "TBD";

      const parsed = new Date(rawDate);
      if (isNaN(parsed)) return rawDate;

      return parsed.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function getMatchTime(match) {
      const rawDate = pick(match, ["time", "matchTime", "utcDate", "kickoff", "startTime"], "");
      if (!rawDate) return "TBD";

      if (typeof rawDate === "string" && rawDate.includes(":") && !rawDate.includes("T")) {
        return rawDate;
      }

      const parsed = new Date(rawDate);
      if (isNaN(parsed)) return "TBD";

      return parsed.toLocaleTimeString(undefined, {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getScore(match) {
      const homeScore = pick(match, [
        "homeScore",
        "home_score",
        "team1Score",
        "score1",
        "homeGoals"
      ], null);

      const awayScore = pick(match, [
        "awayScore",
        "away_score",
        "team2Score",
        "score2",
        "awayGoals"
      ], null);

      if (homeScore !== null && awayScore !== null) {
        return `${homeScore} - ${awayScore}`;
      }

      if (match.score) {
        if (typeof match.score === "string") return match.score;

        if (match.score.fullTime) {
          return `${match.score.fullTime.home ?? 0} - ${match.score.fullTime.away ?? 0}`;
        }

        if (match.score.ft) {
          return `${match.score.ft[0]} - ${match.score.ft[1]}`;
        }
      }

      return "TBD";
    }

    function getStatus(match) {
      const rawStatus = String(
        pick(match, ["status", "matchStatus", "state"], "upcoming")
      ).toLowerCase();

      if (
        rawStatus.includes("live") ||
        rawStatus.includes("in_progress") ||
        rawStatus.includes("playing") ||
        rawStatus.includes("first") ||
        rawStatus.includes("second")
      ) {
        return { text: "LIVE", className: "live" };
      }

      if (
        rawStatus.includes("finished") ||
        rawStatus.includes("full") ||
        rawStatus.includes("completed") ||
        rawStatus.includes("ended")
      ) {
        return { text: "Finished", className: "finished" };
      }

      if (
        rawStatus.includes("scheduled") ||
        rawStatus.includes("upcoming") ||
        rawStatus.includes("not_started")
      ) {
        return { text: "Upcoming", className: "upcoming" };
      }

      return { text: rawStatus.toUpperCase(), className: "unknown" };
    }

    function normalizeMatches(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data.matches)) return data.matches;
      if (Array.isArray(data.data)) return data.data;
      if (data.response && Array.isArray(data.response)) return data.response;
      return [];
    }

    function renderMatches(matches) {
      const tbody = document.getElementById("matches");
      tbody.innerHTML = "";

      if (!matches.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="error">No matches found from the live API.</td>
          </tr>
        `;
        return;
      }

      matches.forEach(match => {
        const home =
          getTeamName(match.homeTeam) ||
          getTeamName(match.team1) ||
          pick(match, ["home", "team1", "home_team"], "TBD");

        const away =
          getTeamName(match.awayTeam) ||
          getTeamName(match.team2) ||
          pick(match, ["away", "team2", "away_team"], "TBD");

        const stage = pick(match, ["stage", "round", "group", "phase"], "TBD");
        const status = getStatus(match);

        const row = document.createElement("tr");

        row.innerHTML = `
          <td data-label="Date">${getMatchDate(match)}</td>
          <td data-label="Time">${getMatchTime(match)}</td>
          <td data-label="Match">${home} vs ${away}</td>
          <td data-label="Stage">${stage}</td>
          <td data-label="Result" class="result">${getScore(match)}</td>
          <td data-label="Status">
            <span class="status ${status.className}">${status.text}</span>
          </td>
        `;

        tbody.appendChild(row);
      });
    }

    async function loadLiveMatches() {
      const tbody = document.getElementById("matches");
      const lastUpdated = document.getElementById("lastUpdated");

      try {
        const response = await fetch(API_URL + "?t=" + Date.now());

        if (!response.ok) {
          throw new Error("API request failed");
        }

        const data = await response.json();
        const matches = normalizeMatches(data);

        renderMatches(matches);

        lastUpdated.textContent =
          "Last updated: " + new Date().toLocaleTimeString();

      } catch (error) {
        console.error(error);

        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="error">
              Could not load live World Cup data.
            </td>
          </tr>
        `;

        lastUpdated.textContent =
          "Live data failed to load. Check API/CORS or try again.";
      }
    }

    updateCountdown();
    loadLiveMatches();

    setInterval(updateCountdown, 1000 * 60 * 60);
    setInterval(loadLiveMatches, 30000);
  </script>

</body>
</html>
