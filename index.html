<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>World Cup 2026 Live Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:    #FFD700;
      --gold-dim: #997f00;
      --navy:    #071B3E;
      --navy-mid:#0D2B5E;
      --navy-light: rgba(255,255,255,0.06);
      --border:  rgba(255,255,255,0.10);
      --text:    #E8F0FF;
      --muted:   #7FA8D8;
      --green:   #10b981;
      --red:     #ef4444;
      --blue:    #3b82f6;
      --gray:    #6b7280;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(160deg, #0a2150 0%, #071B3E 40%, #030e22 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 60px;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 56px 20px 48px;
      border-bottom: 1px solid var(--border);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,215,0,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-eyebrow {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 6px;
      font-size: 14px;
      color: var(--gold);
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(52px, 10vw, 110px);
      line-height: 0.9;
      letter-spacing: 2px;
      color: #fff;
    }

    .hero-title span {
      color: var(--gold);
    }

    .hero-sub {
      margin-top: 20px;
      font-size: 15px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* ── COUNTDOWN ── */
    .countdown-wrap {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 36px auto 0;
      flex-wrap: wrap;
    }

    .countdown-unit {
      text-align: center;
    }

    .countdown-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(56px, 12vw, 100px);
      color: var(--gold);
      line-height: 1;
      display: block;
    }

    .countdown-label {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .countdown-sep {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 60px;
      color: var(--gold-dim);
      align-self: center;
      line-height: 1;
      padding-bottom: 20px;
      opacity: 0.5;
    }

    .started-msg {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(28px, 5vw, 52px);
      color: var(--gold);
      letter-spacing: 3px;
      margin-top: 30px;
    }

    /* ── MAIN CONTENT ── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 0;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: #fff;
    }

    .last-updated {
      font-size: 13px;
      color: var(--muted);
    }

    /* ── API KEY INPUT ── */
    .api-key-bar {
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .api-key-bar label {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      font-weight: 600;
    }

    .api-key-bar input {
      flex: 1;
      min-width: 200px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', monospace;
      font-size: 14px;
      padding: 9px 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .api-key-bar input:focus {
      border-color: var(--gold);
    }

    .api-key-bar input::placeholder { color: var(--gray); }

    .btn {
      padding: 9px 22px;
      background: var(--gold);
      color: #000;
      font-weight: 700;
      font-size: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.85; }

    .api-hint {
      width: 100%;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .api-hint a {
      color: var(--gold);
      text-decoration: none;
    }

    /* ── FILTERS ── */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      font-weight: 700;
    }

    /* ── TABLE ── */
    .table-wrap {
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: rgba(255,255,255,0.04);
    }

    th {
      padding: 14px 16px;
      color: var(--gold);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 2px;
      text-align: left;
      font-weight: 700;
    }

    td {
      padding: 15px 16px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      vertical-align: middle;
    }

    tr:hover td { background: rgba(255,255,255,0.03); }

    .match-teams {
      font-weight: 600;
      font-size: 15px;
    }

    .score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: #a7f3d0;
      letter-spacing: 2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .live {
      background: rgba(239,68,68,0.15);
      color: var(--red);
      border: 1px solid rgba(239,68,68,0.4);
      animation: pulse-border 1.5s infinite;
    }

    .finished {
      background: rgba(16,185,129,0.12);
      color: var(--green);
      border: 1px solid rgba(16,185,129,0.3);
    }

    .upcoming {
      background: rgba(59,130,246,0.12);
      color: #93c5fd;
      border: 1px solid rgba(59,130,246,0.3);
    }

    .unknown {
      background: rgba(107,114,128,0.15);
      color: var(--gray);
      border: 1px solid rgba(107,114,128,0.3);
    }

    .stage-pill {
      font-size: 12px;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
      padding: 3px 10px;
      border-radius: 6px;
    }

    .error-row td {
      text-align: center;
      padding: 40px;
      color: #ffb4b4;
    }

    .empty-row td {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    /* ── ANIMATIONS ── */
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
    }

    /* ── MOBILE ── */
    @media (max-width: 700px) {
      table, thead, tbody, tr, td, th { display: block; }

      thead { display: none; }

      tr {
        margin: 12px 16px;
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        overflow: hidden;
      }

      td {
        border: none;
        border-bottom: 1px solid var(--border);
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      td::before {
        content: attr(data-label);
        color: var(--gold);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        min-width: 60px;
      }

      .table-wrap {
        border-radius: 0;
        background: none;
        border: none;
      }

      .api-key-bar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <header class="hero">
    <p class="hero-eyebrow">⚽ FIFA · USA · Canada · Mexico</p>
    <h1 class="hero-title">World Cup <span>2026</span></h1>
    <p class="hero-sub">Live scores · Fixtures · Results</p>

    <!-- Countdown -->
    <div id="countdown-container"></div>
  </header>

  <!-- MAIN -->
  <main class="container">

    <!-- API Key -->
    <div class="api-key-bar">
      <label for="apiKeyInput">API Key</label>
      <input
        type="text"
        id="apiKeyInput"
        placeholder="Pega tu key de football-data.org aquí..."
        autocomplete="off"
      />
      <button class="btn" onclick="applyKey()">Cargar partidos</button>
      <p class="api-hint">
        Regístrate gratis en
        <a href="https://www.football-data.org/client/register" target="_blank">football-data.org</a>
        — llega al correo en minutos.
      </p>
    </div>

    <!-- Header + Filters -->
    <div class="section-header">
      <h2 class="section-title">Fixtures &amp; Results</h2>
      <span class="last-updated" id="lastUpdated">Esperando API key...</span>
    </div>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="ALL" onclick="setFilter(this)">All</button>
      <button class="filter-btn" data-filter="IN_PLAY" onclick="setFilter(this)">🔴 Live</button>
      <button class="filter-btn" data-filter="FINISHED" onclick="setFilter(this)">✅ Finished</button>
      <button class="filter-btn" data-filter="SCHEDULED" onclick="setFilter(this)">🔵 Upcoming</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Match</th>
            <th>Stage</th>
            <th>Score</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="matches">
          <tr class="empty-row">
            <td colspan="6">Ingresa tu API key y pulsa "Cargar partidos" para ver los fixtures.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <script>
    // ── STATE ──────────────────────────────────────────────
    let allMatches  = [];
    let activeFilter = "ALL";
    let refreshTimer = null;

    // ── COUNTDOWN ─────────────────────────────────────────
    function updateCountdown() {
      const container = document.getElementById("countdown-container");
      const now   = new Date();
      const start = new Date("2026-06-11T14:00:00Z"); // primer partido (hora UTC)
      const diff  = start - now;

      if (diff <= 0) {
        container.innerHTML = `<p class="started-msg">🏆 The World Cup is ON! 🏆</p>`;
        return;
      }

      const days    = Math.floor(diff / (1000*60*60*24));
      const hours   = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
      const minutes = Math.floor((diff % (1000*60*60)) / (1000*60));
      const seconds = Math.floor((diff % (1000*60)) / 1000);

      container.innerHTML = `
        <div class="countdown-wrap">
          <div class="countdown-unit">
            <span class="countdown-num">${String(days).padStart(2,"0")}</span>
            <div class="countdown-label">Days</div>
          </div>
          <div class="countdown-sep">:</div>
          <div class="countdown-unit">
            <span class="countdown-num">${String(hours).padStart(2,"0")}</span>
            <div class="countdown-label">Hours</div>
          </div>
          <div class="countdown-sep">:</div>
          <div class="countdown-unit">
            <span class="countdown-num">${String(minutes).padStart(2,"0")}</span>
            <div class="countdown-label">Minutes</div>
          </div>
          <div class="countdown-sep">:</div>
          <div class="countdown-unit">
            <span class="countdown-num">${String(seconds).padStart(2,"0")}</span>
            <div class="countdown-label">Seconds</div>
          </div>
        </div>
      `;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // ── API ────────────────────────────────────────────────
    function getKey() {
      return document.getElementById("apiKeyInput").value.trim();
    }

    function applyKey() {
      const key = getKey();
      if (!key) {
        alert("Por favor ingresa tu API key primero.");
        return;
      }
      localStorage.setItem("wc2026_apikey", key);
      loadGames(key);

      // Auto-refresh cada 30 s
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => loadGames(getKey()), 30000);
    }

    async function loadGames(apiKey) {
      const tbody       = document.getElementById("matches");
      const lastUpdated = document.getElementById("lastUpdated");

      lastUpdated.textContent = "Cargando...";
      tbody.innerHTML = `<tr class="empty-row"><td colspan="6">Cargando partidos...</td></tr>`;

      try {
        const res = await fetch("https://api.football-data.org/v4/competitions/WC/matches?limit=100", {
          headers: { "X-Auth-Token": apiKey }
        });

        if (res.status === 403) throw new Error("API key inválida o sin permiso para esta competición.");
        if (res.status === 429) throw new Error("Demasiadas peticiones. Espera un momento.");
        if (!res.ok) throw new Error(`Error HTTP ${res.status}`);

        const data = await res.json();
        allMatches = data.matches || [];

        renderMatches();
        lastUpdated.textContent = "Actualizado: " + new Date().toLocaleTimeString();

      } catch (err) {
        console.error(err);
        tbody.innerHTML = `
          <tr class="error-row">
            <td colspan="6">
              ⚠️ ${err.message}<br>
              <small style="color:#888;margin-top:6px;display:block;">
                Revisa la consola del browser para más detalles.
              </small>
            </td>
          </tr>`;
        lastUpdated.textContent = "Error al cargar.";
      }
    }

    // ── FILTER ────────────────────────────────────────────
    function setFilter(btn) {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.filter;
      renderMatches();
    }

    // ── RENDER ────────────────────────────────────────────
    function renderMatches() {
      const tbody = document.getElementById("matches");
      tbody.innerHTML = "";

      const filtered = activeFilter === "ALL"
        ? allMatches
        : allMatches.filter(m => {
            const s = m.status;
            if (activeFilter === "IN_PLAY") return s === "IN_PLAY" || s === "PAUSED" || s === "HALFTIME";
            if (activeFilter === "FINISHED") return s === "FINISHED";
            if (activeFilter === "SCHEDULED") return s === "SCHEDULED" || s === "TIMED";
            return true;
          });

      if (!filtered.length) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="6">Sin partidos para este filtro.</td></tr>`;
        return;
      }

      filtered.forEach(m => {
        const dt    = new Date(m.utcDate);
        const date  = dt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
        const time  = dt.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });

        const ht    = m.homeTeam?.name || "TBD";
        const at    = m.awayTeam?.name || "TBD";

        const hs    = m.score?.fullTime?.home;
        const as_   = m.score?.fullTime?.away;
        const scoreText = (hs !== null && hs !== undefined && as_ !== null && as_ !== undefined)
          ? `${hs} – ${as_}`
          : (m.status === "SCHEDULED" || m.status === "TIMED") ? "–" : "? – ?";

        const stage = (m.stage || "").replace(/_/g, " ");
        const status = getStatus(m.status);

        const row = document.createElement("tr");
        row.innerHTML = `
          <td data-label="Date">${date}</td>
          <td data-label="Time">${time}</td>
          <td data-label="Match" class="match-teams">${ht} vs ${at}</td>
          <td data-label="Stage"><span class="stage-pill">${stage || "TBD"}</span></td>
          <td data-label="Score" class="score">${scoreText}</td>
          <td data-label="Status"><span class="badge ${status.cls}">${status.text}</span></td>
        `;
        tbody.appendChild(row);
      });
    }

    function getStatus(raw = "") {
      const s = raw.toUpperCase();
      if (["IN_PLAY","PAUSED","HALFTIME"].includes(s))   return { text: "LIVE",     cls: "live" };
      if (s === "FINISHED")                              return { text: "Finished", cls: "finished" };
      if (["SCHEDULED","TIMED"].includes(s))             return { text: "Upcoming", cls: "upcoming" };
      return { text: raw || "?", cls: "unknown" };
    }

    // ── RESTORE KEY FROM LOCALSTORAGE ─────────────────────
    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("wc2026_apikey");
      if (saved) {
        document.getElementById("apiKeyInput").value = saved;
        applyKey();
      }
    });
  </script>

</body>
</html>
