<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>World Cup 2026 Live Tracker</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #FFD700;
      --gold-dim: #997f00;
      --text: #E8F0FF;
      --muted: #7FA8D8;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --gray: #6b7280;
      --border: rgba(255,255,255,0.10);
      --card: rgba(255,255,255,0.06);
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #0a2150 0%, #071B3E 40%, #030e22 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .hero {
      text-align: center;
      padding: 56px 20px 48px;
      border-bottom: 1px solid var(--border);
    }

    .hero-eyebrow {
      letter-spacing: 5px;
      font-size: 13px;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: clamp(52px, 10vw, 110px);
      line-height: .9;
      color: white;
    }

    .hero-title span { color: var(--gold); }

    .hero-sub {
      margin-top: 20px;
      color: var(--muted);
    }

    .countdown-wrap {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 36px;
      flex-wrap: wrap;
    }

    .countdown-num {
      font-size: clamp(56px, 12vw, 100px);
      color: var(--gold);
      font-weight: bold;
      display: block;
    }

    .countdown-label {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .started-msg {
      font-size: clamp(28px, 5vw, 52px);
      color: var(--gold);
      margin-top: 30px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 0;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 32px;
      color: white;
    }

    .last-updated {
      font-size: 13px;
      color: var(--muted);
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      font-weight: 700;
    }

    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: rgba(255,255,255,0.04);
    }

    th {
      padding: 14px 16px;
      color: var(--gold);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 2px;
      text-align: left;
    }

    td {
      padding: 15px 16px;
      border-top: 1px solid var(--border);
      font-size: 14px;
    }

    tr:hover td {
      background: rgba(255,255,255,0.03);
    }

    .match-teams {
      font-weight: 600;
    }

    .score {
      font-size: 20px;
      color: #a7f3d0;
      font-weight: bold;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 11px;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .live {
      background: rgba(239,68,68,0.15);
      color: var(--red);
      border: 1px solid rgba(239,68,68,0.4);
    }

    .finished {
      background: rgba(16,185,129,0.12);
      color: var(--green);
      border: 1px solid rgba(16,185,129,0.3);
    }

    .upcoming {
      background: rgba(59,130,246,0.12);
      color: #93c5fd;
      border: 1px solid rgba(59,130,246,0.3);
    }

    .unknown {
      background: rgba(107,114,128,0.15);
      color: var(--gray);
      border: 1px solid rgba(107,114,128,0.3);
    }

    .stage-pill {
      font-size: 12px;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .error-row td,
    .empty-row td {
      text-align: center;
      padding: 40px;
      color: #ffb4b4;
    }

    @media (max-width: 700px) {
      table, thead, tbody, tr, td, th { display: block; }
      thead { display: none; }

      tr {
        margin: 12px 16px;
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        overflow: hidden;
      }

      td {
        border: none;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      td::before {
        content: attr(data-label);
        color: var(--gold);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .table-wrap {
        border-radius: 0;
        background: none;
        border: none;
      }
    }
  </style>
</head>

<body>

  <header class="hero">
    <p class="hero-eyebrow">⚽ FIFA · USA · CANADA · MEXICO</p>
    <h1 class="hero-title">World Cup <span>2026</span></h1>
    <p class="hero-sub">Live scores · Fixtures · Results</p>
    <div id="countdown-container"></div>
  </header>

  <main class="container">

    <div class="section-header">
      <h2 class="section-title">Fixtures & Results</h2>
      <span class="last-updated" id="lastUpdated">Loading...</span>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="ALL" onclick="setFilter(this)">All</button>
      <button class="filter-btn" data-filter="IN_PLAY" onclick="setFilter(this)">🔴 Live</button>
      <button class="filter-btn" data-filter="FINISHED" onclick="setFilter(this)">✅ Finished</button>
      <button class="filter-btn" data-filter="SCHEDULED" onclick="setFilter(this)">🔵 Upcoming</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Match</th>
            <th>Stage</th>
            <th>Score</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="matches">
          <tr class="empty-row">
            <td colspan="6">Loading matches...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <script>
    const API_URL = "https://countdown.julianbuitrago16.workers.dev";

    let allMatches = [];
    let activeFilter = "ALL";
    let refreshTimer = null;

    function updateCountdown() {
      const container = document.getElementById("countdown-container");
      const now = new Date();
      const start = new Date("2026-06-11T14:00:00Z");
      const diff = start - now;

      if (diff <= 0) {
        container.innerHTML = `<p class="started-msg">🏆 The World Cup is ON! 🏆</p>`;
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      container.innerHTML = `
        <div class="countdown-wrap">
          <div>
            <span class="countdown-num">${String(days).padStart(2, "0")}</span>
            <div class="countdown-label">Days</div>
          </div>
          <div>
            <span class="countdown-num">${String(hours).padStart(2, "0")}</span>
            <div class="countdown-label">Hours</div>
          </div>
          <div>
            <span class="countdown-num">${String(minutes).padStart(2, "0")}</span>
            <div class="countdown-label">Minutes</div>
          </div>
          <div>
            <span class="countdown-num">${String(seconds).padStart(2, "0")}</span>
            <div class="countdown-label">Seconds</div>
          </div>
        </div>
      `;
    }

    async function loadGames() {
      const tbody = document.getElementById("matches");
      const lastUpdated = document.getElementById("lastUpdated");

      lastUpdated.textContent = "Loading...";
      tbody.innerHTML = `
        <tr class="empty-row">
          <td colspan="6">Loading matches...</td>
        </tr>
      `;

      try {
        const response = await fetch(API_URL + "?t=" + Date.now());
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || `Error ${response.status}`);
        }

        allMatches = data.matches || [];

        renderMatches();

        lastUpdated.textContent =
          "Updated: " + new Date().toLocaleTimeString();

      } catch (err) {
        console.error(err);

        tbody.innerHTML = `
          <tr class="error-row">
            <td colspan="6">
              ⚠️ ${err.message}
            </td>
          </tr>
        `;

        lastUpdated.textContent = "Failed to load.";
      }
    }

    function setFilter(btn) {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.filter;
      renderMatches();
    }

    function renderMatches() {
      const tbody = document.getElementById("matches");
      tbody.innerHTML = "";

      const filtered = activeFilter === "ALL"
        ? allMatches
        : allMatches.filter(m => {
            const s = m.status;
            if (activeFilter === "IN_PLAY") return ["IN_PLAY", "PAUSED", "HALFTIME"].includes(s);
            if (activeFilter === "FINISHED") return s === "FINISHED";
            if (activeFilter === "SCHEDULED") return ["SCHEDULED", "TIMED"].includes(s);
            return true;
          });

      if (!filtered.length) {
        tbody.innerHTML = `
          <tr class="empty-row">
            <td colspan="6">No matches for this filter.</td>
          </tr>
        `;
        return;
      }

      filtered.forEach(m => {
        const dt = new Date(m.utcDate);

        const date = isNaN(dt)
          ? "TBD"
          : dt.toLocaleDateString(undefined, {
              month: "short",
              day: "numeric",
              year: "numeric"
            });

        const time = isNaN(dt)
          ? "TBD"
          : dt.toLocaleTimeString(undefined, {
              hour: "2-digit",
              minute: "2-digit"
            });

        const homeTeam = m.homeTeam?.name || "TBD";
        const awayTeam = m.awayTeam?.name || "TBD";

        const homeScore = m.score?.fullTime?.home;
        const awayScore = m.score?.fullTime?.away;

        const scoreText =
          homeScore !== null &&
          homeScore !== undefined &&
          awayScore !== null &&
          awayScore !== undefined
            ? `${homeScore} – ${awayScore}`
            : "–";

        const stage = (m.stage || "TBD").replace(/_/g, " ");
        const status = getStatus(m.status);

        const row = document.createElement("tr");

        row.innerHTML = `
          <td data-label="Date">${date}</td>
          <td data-label="Time">${time}</td>
          <td data-label="Match" class="match-teams">${homeTeam} vs ${awayTeam}</td>
          <td data-label="Stage"><span class="stage-pill">${stage}</span></td>
          <td data-label="Score" class="score">${scoreText}</td>
          <td data-label="Status"><span class="badge ${status.cls}">${status.text}</span></td>
        `;

        tbody.appendChild(row);
      });
    }

    function getStatus(raw = "") {
      const s = raw.toUpperCase();

      if (["IN_PLAY", "PAUSED", "HALFTIME"].includes(s)) {
        return { text: "LIVE", cls: "live" };
      }

      if (s === "FINISHED") {
        return { text: "Finished", cls: "finished" };
      }

      if (["SCHEDULED", "TIMED"].includes(s)) {
        return { text: "Upcoming", cls: "upcoming" };
      }

      return { text: raw || "?", cls: "unknown" };
    }

    updateCountdown();
    loadGames();

    setInterval(updateCountdown, 1000);

    refreshTimer = setInterval(loadGames, 60000);
  </script>

</body>
</html>
