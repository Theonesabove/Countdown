<script>
  // --------------------------
  // Countdown
  // --------------------------
  function updateCountdown() {
    const now = new Date();
    const worldCupStart = new Date("2026-06-11T00:00:00");

    const oneDay = 1000 * 60 * 60 * 24;
    const diff = Math.ceil((worldCupStart - now) / oneDay);

    document.getElementById("days").textContent =
      diff > 0 ? diff : 0;

    document.getElementById("label").textContent =
      diff > 0
        ? "days left until World Cup 2026"
        : "World Cup 2026 has started";
  }

  updateCountdown();
  setInterval(updateCountdown, 1000 * 60 * 60);

  // --------------------------
  // Render Matches
  // --------------------------
  function renderMatches(matches) {
    const tbody = document.getElementById("matches");
    tbody.innerHTML = "";

    matches.forEach(match => {
      const home = match.team1 || "TBD";
      const away = match.team2 || "TBD";

      let result = "TBD";

      if (
        match.score1 !== undefined &&
        match.score2 !== undefined
      ) {
        result = `${match.score1} - ${match.score2}`;
      }

      const row = document.createElement("tr");

      row.innerHTML = `
        <td data-label="Date">${match.date}</td>
        <td data-label="Match">${home} vs ${away}</td>
        <td data-label="Stage">${match.group || "Stage TBD"}</td>
        <td data-label="Result" class="result">${result}</td>
      `;

      tbody.appendChild(row);
    });
  }

  // --------------------------
  // Load World Cup Data
  // --------------------------
  async function loadWorldCupData() {
    try {
      const response = await fetch(
        "https://raw.githubusercontent.com/openfootball/world-cup.json/master/2022--qatar/cup.txt"
      );

      const text = await response.text();

      // crude parser
      const lines = text.split("\\n");

      const matches = [];
      let currentDate = "";

      lines.forEach(line => {
        line = line.trim();

        // date line
        if (line.match(/^\\d{4}-\\d{2}-\\d{2}/)) {
          currentDate = line;
        }

        // match line
        if (line.includes(" - ")) {
          const matchRegex =
            /(.*?)\\s+-\\s+(.*?)\\s+(\\d+):(\\d+)/;

          const found = line.match(matchRegex);

          if (found) {
            matches.push({
              date: currentDate,
              team1: found[1].trim(),
              team2: found[2].trim(),
              score1: found[3],
              score2: found[4],
              group: "World Cup"
            });
          }
        }
      });

      renderMatches(matches.slice(0, 20));

    } catch (err) {
      console.error(err);

      document.getElementById("matches").innerHTML = `
        <tr>
          <td colspan="4">
            Could not load World Cup data
          </td>
        </tr>
      `;
    }
  }

  loadWorldCupData();
</script>
