<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>World Cup 2026 Live Tracker</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #0a2150, #071B3E, #030e22);
      color: white;
      padding-bottom: 60px;
      text-align: center;
    }

    .hero {
      padding: 56px 20px 48px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .hero-title {
      font-size: clamp(52px, 10vw, 110px);
      margin: 0;
      color: white;
    }

    .hero-title span {
      color: #FFD700;
    }

    .hero-sub {
      color: #7FA8D8;
      margin-top: 10px;
    }

    .countdown-wrap {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .countdown-num {
      font-size: clamp(48px, 10vw, 90px);
      color: #FFD700;
      font-weight: bold;
      display: block;
    }

    .countdown-label {
      color: #7FA8D8;
      font-size: 12px;
      text-transform: uppercase;
    }

    .started-msg {
      color: #FFD700;
      font-size: 40px;
      margin-top: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px 0;
    }

    .api-key-bar {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .api-key-bar label {
      color: #7FA8D8;
      font-weight: bold;
    }

    .api-key-bar input {
      flex: 1;
      min-width: 220px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.35);
      color: white;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #FFD700;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 34px;
      margin: 0;
    }

    .last-updated {
      color: #7FA8D8;
      font-size: 13px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: #7FA8D8;
      cursor: pointer;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #FFD700;
      color: black;
      font-weight: bold;
    }

    .table-wrap {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      padding: 14px;
      color: #FFD700;
      text-transform: uppercase;
      font-size: 12px;
      text-align: left;
    }

    td {
      padding: 15px;
      border-top: 1px solid rgba(255,255,255,0.12);
      text-align: left;
    }

    .score {
      color: #a7f3d0;
      font-weight: bold;
      font-size: 20px;
    }

    .badge {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .live {
      background: rgba(239,68,68,0.2);
      color: #ef4444;
    }

    .finished {
      background: rgba(16,185,129,0.2);
      color: #10b981;
    }

    .upcoming {
      background: rgba(59,130,246,0.2);
      color: #93c5fd;
    }

    .unknown {
      background: rgba(107,114,128,0.2);
      color: #9ca3af;
    }

    .stage-pill {
      color: #7FA8D8;
    }

    .empty-row td,
    .error-row td {
      text-align: center;
      padding: 40px;
      color: #ffb4b4;
    }

    @media (max-width: 700px) {
      table, thead, tbody, tr, td, th {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        margin: 12px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        overflow: hidden;
      }

      td {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      td::before {
        content: attr(data-label);
        color: #FFD700;
        font-weight: bold;
      }
    }
  </style>
</head>

<body>

  <header class="hero">
    <h1 class="hero-title">World Cup <span>2026</span></h1>
    <p class="hero-sub">Live scores · Fixtures · Results</p>
    <div id="countdown-container"></div>
  </header>

  <main class="container">

    <div class="api-key-bar">
      <label for="apiKeyInput">API Key</label>
      <input
        type="text"
        id="apiKeyInput"
        placeholder="Paste your football-data.org API key"
        autocomplete="off"
      />
      <button class="btn" onclick="applyKey()">Cargar partidos</button>
    </div>

    <div class="section-header">
      <h2 class="section-title">Fixtures & Results</h2>
      <span class="last-updated" id="lastUpdated">Esperando API key...</span>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="ALL" onclick="setFilter(this)">All</button>
      <button class="filter-btn" data-filter="IN_PLAY" onclick="setFilter(this)">🔴 Live</button>
      <button class="filter-btn" data-filter="FINISHED" onclick="setFilter(this)">✅ Finished</button>
      <button class="filter-btn" data-filter="SCHEDULED" onclick="setFilter(this)">🔵 Upcoming</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Match</th>
            <th>Stage</th>
            <th>Score</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="matches">
          <tr class="empty-row">
            <td colspan="6">Ingresa tu API key y pulsa "Cargar partidos".</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <script>
    let allMatches = [];
    let activeFilter = "ALL";
    let refreshTimer = null;

    function updateCountdown() {
      const container = document.getElementById("countdown-container");
      const now = new Date();
      const start = new Date("2026-06-11T14:00:00Z");
      const diff = start - now;

      if (diff <= 0) {
        container.innerHTML = `<p class="started-msg">🏆 The World Cup is ON! 🏆</p>`;
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      container.innerHTML = `
        <div class="countdown-wrap">
          <div>
            <span class="countdown-num">${String(days).padStart(2, "0")}</span>
            <div class="countdown-label">Days</div>
          </div>
          <div>
            <span class="countdown-num">${String(hours).padStart(2, "0")}</span>
            <div class="countdown-label">Hours</div>
          </div>
          <div>
            <span class="countdown-num">${String(minutes).padStart(2, "0")}</span>
            <div class="countdown-label">Minutes</div>
          </div>
          <div>
            <span class="countdown-num">${String(seconds).padStart(2, "0")}</span>
            <div class="countdown-label">Seconds</div>
          </div>
        </div>
      `;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    function getKey() {
      return document.getElementById("apiKeyInput").value.trim();
    }

    function applyKey() {
      const key = getKey();

      if (!key) {
        alert("Por favor ingresa tu API key primero.");
        return;
      }

      localStorage.setItem("wc2026_apikey", key);

      loadGames(key);

      if (refreshTimer) clearInterval(refreshTimer);

      refreshTimer = setInterval(() => {
        loadGames(getKey());
      }, 60000);
    }

    async function loadGames(apiKey) {
      const tbody = document.getElementById("matches");
      const lastUpdated = document.getElementById("lastUpdated");

      lastUpdated.textContent = "Cargando...";

      tbody.innerHTML = `
        <tr class="empty-row">
          <td colspan="6">Cargando partidos...</td>
        </tr>
      `;

      try {
        const response = await fetch(
          "https://api.football-data.org/v4/competitions/WC/matches",
          {
            method: "GET",
            headers: {
              "X-Auth-Token": apiKey
            }
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            `Football Data API Error ${response.status}`
          );
        }

        allMatches = data.matches || [];

        renderMatches();

        lastUpdated.textContent =
          "Actualizado: " + new Date().toLocaleTimeString();

      } catch (err) {
        console.error(err);

        tbody.innerHTML = `
          <tr class="error-row">
            <td colspan="6">
              ⚠️ ${err.message}<br><br>
              Si ves un error de CORS en consola, esta API no permite llamadas directas desde HTML estático.
            </td>
          </tr>
        `;

        lastUpdated.textContent = "Error al cargar.";
      }
    }

    function setFilter(btn) {
      document.querySelectorAll(".filter-btn").forEach(b => {
        b.classList.remove("active");
      });

      btn.classList.add("active");
      activeFilter = btn.dataset.filter;

      renderMatches();
    }

    function renderMatches() {
      const tbody = document.getElementById("matches");
      tbody.innerHTML = "";

      const filtered = activeFilter === "ALL"
        ? allMatches
        : allMatches.filter(m => {
            const s = m.status;

            if (activeFilter === "IN_PLAY") {
              return ["IN_PLAY", "PAUSED", "HALFTIME"].includes(s);
            }

            if (activeFilter === "FINISHED") {
              return s === "FINISHED";
            }

            if (activeFilter === "SCHEDULED") {
              return ["SCHEDULED", "TIMED"].includes(s);
            }

            return true;
          });

      if (!filtered.length) {
        tbody.innerHTML = `
          <tr class="empty-row">
            <td colspan="6">Sin partidos para este filtro.</td>
          </tr>
        `;
        return;
      }

      filtered.forEach(m => {
        const dt = new Date(m.utcDate);

        const date = dt.toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric"
        });

        const time = dt.toLocaleTimeString(undefined, {
          hour: "2-digit",
          minute: "2-digit"
        });

        const homeTeam = m.homeTeam?.name || "TBD";
        const awayTeam = m.awayTeam?.name || "TBD";

        const homeScore = m.score?.fullTime?.home;
        const awayScore = m.score?.fullTime?.away;

        const scoreText =
          homeScore !== null &&
          homeScore !== undefined &&
          awayScore !== null &&
          awayScore !== undefined
            ? `${homeScore} – ${awayScore}`
            : "–";

        const stage = (m.stage || "TBD").replace(/_/g, " ");
        const status = getStatus(m.status);

        const row = document.createElement("tr");

        row.innerHTML = `
          <td data-label="Date">${date}</td>
          <td data-label="Time">${time}</td>
          <td data-label="Match">${homeTeam} vs ${awayTeam}</td>
          <td data-label="Stage"><span class="stage-pill">${stage}</span></td>
          <td data-label="Score" class="score">${scoreText}</td>
          <td data-label="Status">
            <span class="badge ${status.cls}">${status.text}</span>
          </td>
        `;

        tbody.appendChild(row);
      });
    }

    function getStatus(raw = "") {
      const s = raw.toUpperCase();

      if (["IN_PLAY", "PAUSED", "HALFTIME"].includes(s)) {
        return { text: "LIVE", cls: "live" };
      }

      if (s === "FINISHED") {
        return { text: "Finished", cls: "finished" };
      }

      if (["SCHEDULED", "TIMED"].includes(s)) {
        return { text: "Upcoming", cls: "upcoming" };
      }

      return { text: raw || "?", cls: "unknown" };
    }

    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("wc2026_apikey");

      if (saved) {
        document.getElementById("apiKeyInput").value = saved;
        applyKey();
      }
    });
  </script>

</body>
</html>
