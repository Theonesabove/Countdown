<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>World Cup 2026 Countdown</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #0f3d7a 0%, #071a3d 45%, #04101f 100%);
      color: white;
    }

    body {
      padding: 30px 16px 60px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 70px);
      font-weight: 900;
      text-shadow:
        0 0 10px rgba(255,255,255,.5),
        0 0 25px rgba(0,194,255,.6);
    }

    #days {
      margin-top: 20px;
      font-size: clamp(70px, 18vw, 180px);
      font-weight: 900;
      line-height: 1;
      color: #ffd700;

      text-shadow:
        0 0 20px rgba(255,215,0,.8),
        0 0 40px rgba(255,215,0,.5);
    }

    #label {
      margin-top: 10px;
      font-size: clamp(18px, 3vw, 32px);
      color: #dbeafe;
    }

    .card {
      width: 100%;
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 24px;

      background: rgba(255,255,255,0.06);

      border: 1px solid rgba(255,255,255,0.12);

      border-radius: 20px;

      backdrop-filter: blur(10px);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: clamp(24px, 4vw, 40px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 14px;
    }

    thead {
      background: rgba(255,255,255,0.08);
    }

    th {
      padding: 14px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffd700;
    }

    td {
      padding: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 15px;
    }

    tr:hover {
      background: rgba(255,255,255,0.04);
    }

    .result {
      font-weight: bold;
      color: #a7f3d0;
    }

    .loading {
      padding: 30px;
      color: #dbeafe;
      font-size: 18px;
    }

    .error {
      color: #ffb4b4;
      padding: 30px;
      font-size: 18px;
    }

    @media (max-width: 850px) {

      table,
      thead,
      tbody,
      tr,
      td,
      th {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        margin-bottom: 14px;
        border-radius: 14px;
        overflow: hidden;
        background: rgba(255,255,255,0.05);
      }

      td {
        text-align: left;
        border: none;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }

      td::before {
        content: attr(data-label) ": ";
        font-weight: bold;
        color: #ffd700;
      }
    }
  </style>
</head>

<body>

  <h1>🏆 WORLD CUP 2026 🏆</h1>

  <div id="days">--</div>

  <div id="label">
    days left until kickoff
  </div>

  <div class="card">

    <h2>Fixtures & Results</h2>

    <table>

      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Match</th>
          <th>Stage</th>
          <th>Result</th>
        </tr>
      </thead>

      <tbody id="matches">
        <tr>
          <td colspan="5" class="loading">
            Loading matches...
          </td>
        </tr>
      </tbody>

    </table>

  </div>

  <script>

    // -------------------------
    // Countdown
    // -------------------------

    function updateCountdown() {

      const now = new Date();

      const worldCupStart =
        new Date("2026-06-11T00:00:00");

      const diff =
        Math.ceil(
          (worldCupStart - now) /
          (1000 * 60 * 60 * 24)
        );

      document.getElementById("days")
        .textContent = diff > 0 ? diff : 0;

      document.getElementById("label")
        .textContent =
          diff > 0
            ? "days left until kickoff"
            : "The World Cup has started";

    }

    // -------------------------
    // Result formatting
    // -------------------------

    function getResult(match) {

      if (
        !match.score ||
        !match.score.ft
      ) {
        return "TBD";
      }

      return `${match.score.ft[0]} - ${match.score.ft[1]}`;

    }

    // -------------------------
    // Render matches
    // -------------------------

    function renderMatches(matches) {

      const tbody =
        document.getElementById("matches");

      tbody.innerHTML = "";

      matches.forEach(match => {

        const row =
          document.createElement("tr");

        row.innerHTML = `
          <td data-label="Date">
            ${match.date || "TBD"}
          </td>

          <td data-label="Time">
            ${match.time || "TBD"}
          </td>

          <td data-label="Match">
            ${match.team1 || "TBD"}
            vs
            ${match.team2 || "TBD"}
          </td>

          <td data-label="Stage">
            ${match.group || match.round || "TBD"}
          </td>

          <td data-label="Result" class="result">
            ${getResult(match)}
          </td>
        `;

        tbody.appendChild(row);

      });

    }

    // -------------------------
    // Load data
    // -------------------------

    async function loadWorldCupData() {

      const tbody =
        document.getElementById("matches");

      try {

        const response = await fetch(
          "https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026--usa-canada-mexico/cup.json"
        );

        if (!response.ok) {
          throw new Error("Failed loading data");
        }

        const data =
          await response.json();

        if (
          !data.matches ||
          !Array.isArray(data.matches)
        ) {
          throw new Error("Invalid data");
        }

        renderMatches(data.matches);

      }

      catch (err) {

        console.error(err);

        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="error">
              Could not load World Cup data
            </td>
          </tr>
        `;

      }

    }

    // -------------------------
    // Init
    // -------------------------

    updateCountdown();

    loadWorldCupData();

    setInterval(
      updateCountdown,
      1000 * 60 * 60
    );

  </script>

</body>
</html>
